
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#171923;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 min-height:100vh;padding:25px 15px;
}
.app{width:100%;max-width:390px}
.header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:48px;margin:0;color:#f5b942}
.scores{display:flex;gap:8px}
.score{
 background:#292e3d;padding:10px 15px;
 border-radius:12px;text-align:center;
 font-size:12px;color:#aaa;
}
.score b{display:block;font-size:20px;color:white;margin-top:4px}
.info{color:#aaa;margin:25px 0 15px}
button{
 border:0;border-radius:10px;padding:12px 17px;
 background:#f5b942;color:#171923;
 font-weight:bold;font-size:14px;
}
.board{
 width:100%;aspect-ratio:1;
 background:#292e3d;padding:9px;
 border-radius:13px;
 display:grid;grid-template-columns:repeat(4,1fr);
 grid-template-rows:repeat(4,1fr);gap:8px;
 touch-action:none;
}
.cell{
 background:#393f50;border-radius:8px;
 display:flex;align-items:center;
 justify-content:center;
 font-size:clamp(23px,7vw,34px);
 font-weight:bold;color:#242424;
}
.v2{background:#eee4da}
.v4{background:#ede0c8}
.v8{background:#f2b179}
.v16{background:#f59563}
.v32{background:#f67c5f}
.v64{background:#f65e3b}
.v128{background:#edcf72;font-size:27px}
.v256{background:#edcc61;font-size:27px}
.v512{background:#edc850;font-size:27px}
.v1024,.v2048{background:#edc53f;font-size:23px}
.vbig{background:#d5b42c;font-size:20px}
.controls{display:flex;justify-content:space-between;align-items:center;margin:20px 0}
.hint{text-align:center;color:#858b9b;font-size:13px}
.gameover{
 display:none;text-align:center;padding:15px;
 background:#292e3d;border-radius:12px;margin-top:15px;
}
</style>
</head>
<body>
<div class="app">
 <div class="header">
  <h1>2048</h1>
  <div class="scores">
   <div class="score">СЧЁТ<b id="score">0</b></div>
   <div class="score">РЕКОРД<b id="best">0</b></div>
  </div>
 </div>

 <div class="info">Объединяй одинаковые числа и получи 2048!</div>

 <div class="controls">
  <span style="color:#aaa">Новая партия</span>
  <button onclick="newGame()">НОВАЯ ИГРА</button>
 </div>

 <div class="board" id="board"></div>

 <div class="gameover" id="over">
  <h2>Игра окончена!</h2>
  <button onclick="newGame()">Играть снова</button>
 </div>

 <p class="hint">Управление: свайпай по игровому полю</p>
</div>

<script>
let grid,score=0;
let best=Number(localStorage.getItem("2048best"))||0;
let board=document.getElementById("board");

function newGame(){
 grid=Array.from({length:4},()=>Array(4).fill(0));
 score=0;
 document.getElementById("over").style.display="none";
 addTile();addTile();draw();
}

function addTile(){
 let empty=[];
 grid.forEach((row,y)=>row.forEach((v,x)=>{
  if(!v)empty.push([y,x]);
 }));
 if(!empty.length)return;
 let [y,x]=empty[Math.floor(Math.random()*empty.length)];
 grid[y][x]=Math.random()<0.9?2:4;
}

function draw(){
 board.innerHTML="";
 grid.forEach(row=>row.forEach(v=>{
  let cell=document.createElement("div");
  cell.className="cell";
  if(v){
   cell.textContent=v;
   cell.classList.add(v<=2048?"v"+v:"vbig");
  }
  board.appendChild(cell);
 }));
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
}

function move(direction){
 let old=JSON.stringify(grid);
 let gained=0;

 for(let i=0;i<4;i++){
  let line=[];
  for(let j=0;j<4;j++){
   let y=direction==="up"?j:direction==="down"?3-j:i;
   let x=direction==="left"?j:direction==="right"?3-j:i;
   line.push(grid[y][x]);
  }

  let values=line.filter(v=>v);
  for(let j=0;j<values.length-1;j++){
   if(values[j]===values[j+1]){
    values[j]*=2;
    gained+=values[j];
    values.splice(j+1,1);
   }
  }
  while(values.length<4)values.push(0);

  for(let j=0;j<4;j++){
   let y=direction==="up"?j:direction==="down"?3-j:i;
   let x=direction==="left"?j:direction==="right"?3-j:i;
   grid[y][x]=values[j];
  }
 }

 if(old===JSON.stringify(grid))return;

 score+=gained;
 if(score>best){
  best=score;
  localStorage.setItem("2048best",best);
 }
 addTile();
 draw();

 if(!canMove()){
  document.getElementById("over").style.display="block";
 }
}

function canMove(){
 for(let y=0;y<4;y++){
  for(let x=0;x<4;x++){
   if(!grid[y][x])return true;
   if(x<3&&grid[y][x]===grid[y][x+1])return true;
   if(y<3&&grid[y][x]===grid[y+1][x])return true;
  }
 }
 return false;
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:"up",ArrowDown:"down",
  ArrowLeft:"left",ArrowRight:"right"
 };
 if(keys[e.key]){
  e.preventDefault();
  move(keys[e.key]);
 }
});

let startX=0,startY=0;
board.addEventListener("touchstart",e=>{
 startX=e.touches[0].clientX;
 startY=e.touches[0].clientY;
},{passive:true});

board.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-startX;
 let dy=e.changedTouches[0].clientY-startY;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
 if(Math.abs(dx)>Math.abs(dy))
  move(dx>0?"right":"left");
 else
  move(dy>0?"down":"up");
},{passive:true});

newGame();
</script>
</body>
</html>
