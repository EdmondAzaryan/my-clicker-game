<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Кликер</title>
    <!-- Подключаем библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 20px;
        }
        .click-btn {
            background-color: #0f3460;
            border: 4px solid #e94560;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            font-size: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px #e94560;
            transition: transform 0.1s;
        }
        .click-btn:active {
            transform: scale(0.95);
        }
        .info {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="score" id="score">0</div>
    
    <div class="click-btn" id="clickBtn">
        💎
    </div>

    <div class="info">
        Нажимай на кристалл, чтобы зарабатывать очки!<br>
        При выходе очки сохранятся.
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        let score = 0;
        let scoreElement = document.getElementById('score');
        let clickBtn = document.getElementById('clickBtn');

        // Обработка клика
        clickBtn.addEventListener('click', () => {
            score++;
            scoreElement.innerText = score;
            
            // Вибрация (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Отправка данных боту при закрытии (MainButton)
        tg.MainButton.setText("Сохранить и выйти");
        tg.MainButton.show();
        
        tg.MainButton.onClick(() => {
            // Отправляем данные боту
            tg.sendData(JSON.stringify({ score: score }));
            tg.close();
        });
    </script>
</body>
</html>
