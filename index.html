<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash Widget</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-box {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 320px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 10px; }
        button {
            padding: 10px 24px; background: #e11d48; color: white;
            border: none; border-radius: 6px; font-weight: bold; font-size: 14px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
        }
        button:active { transform: scale(0.95); }
        .score { position: absolute; top: 8px; right: 12px; font-weight: bold; font-size: 14px; color: #f87171; }
    </style>
</head>
<body>

<div id="game-box">
    <div class="score">ОЧКИ: <span id="score-val">0</span></div>

    <div id="start-screen" class="overlay">
        <h1>GEOMETRY DASH</h1>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Жми на экран для прыжка</p>
        <button onclick="startGame()">ИГРАТЬ</button>
    </div>

    <div id="over-screen" class="overlay hidden">
        <h1 style="color: #ef4444;">ВРЕЗАЛСЯ!</h1>
        <p id="final-score" style="font-size: 13px; margin-bottom: 15px;">Счет: 0</p>
        <button onclick="startGame()">СНОВА</button>
    </div>

    <canvas id="canvas" width="400" height="240"></canvas>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let score = 0;
let animId;

const player = { x: 40, y: 160, size: 24, dy: 0, gravity: 0.75, jump: -10, grounded: false, rot: 0 };
const groundY = 190;
let spikes = [];
let timer = 0;

function doJump() {
    if (player.grounded && isPlaying) {
        player.dy = player.jump;
        player.grounded = false;
    }
}

document.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
document.addEventListener('mousedown', doJump);

function spawnSpike() {
    spikes.push({ x: canvas.width, y: groundY - 24, w: 24, h: 24 });
}

function update() {
    if (!isPlaying) return;

    player.dy += player.gravity;
    player.y += player.dy;

    if (player.y + player.size >= groundY) {
        player.y = groundY - player.size;
        player.dy = 0;
        player.grounded = true;
        player.rot = 0;
    } else {
        player.rot += 10;
    }

    timer++;
    if (timer > 70 + Math.random() * 40) {
        spawnSpike();
        timer = 0;
    }

    for (let i = 0; i < spikes.length; i++) {
        let s = spikes[i];
        s.x -= 4.5;

        // Коллизия
        if (player.x < s.x + s.w && player.x + player.size > s.x &&
            player.y < s.y + s.h && player.y + player.size > s.y) {
            gameOver();
            return;
        }

        if (s.x + s.w < 0) {
            spikes.splice(i, 1); i--;
            score += 10;
            document.getElementById('score-val').textContent = score;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Земля
    ctx.fillStyle = '#334155';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(0, groundY, canvas.width, 3);

    // Кубик
    ctx.save();
    ctx.translate(player.x + player.size/2, player.y + player.size/2);
    ctx.rotate((player.rot * Math.PI) / 180);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.fillStyle = '#fff';
    ctx.fillRect(2, -6, 6, 6);
    ctx.restore();

    // Шипы
    for (let s of spikes) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(s.x, groundY);
        ctx.lineTo(s.x + s.w / 2, s.y);
        ctx.lineTo(s.x + s.w, groundY);
        ctx.closePath();
        ctx.fill();
    }
}

function loop() {
    update();
    draw();
    if (isPlaying) animId = requestAnimationFrame(loop);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('over-screen').classList.add('hidden');
    score = 0; spikes = []; player.y = 160; player.dy = 0;
    document.getElementById('score-val').textContent = 0;
    isPlaying = true;
    loop();
}

function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animId);
    document.getElementById('final-score').textContent = 'Ваш счет: ' + score;
    document.getElementById('over-screen').classList.remove('hidden');
}
</script>
</body>
</html>
